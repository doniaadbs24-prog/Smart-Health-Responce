name: smart_health_response
description: "Smart Health Response - Emergency response Flutter application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  provider: ^6.1.2
  google_fonts: ^6.2.1
  go_router: ^14.2.0

  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  geolocator: ^13.0.1
  geocoding: ^3.0.0

  permission_handler: ^11.3.1

  image_picker: ^1.1.2
  video_player: ^2.9.1
  cached_network_image: ^3.3.1
  file_picker: ^8.0.6
  record: ^5.1.2

  intl: ^0.19.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  pin_code_fields: ^8.0.1
  flutter_local_notifications: ^17.2.2
  firebase_core: ^4.7.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  http: ^1.2.0
  pdf: ^3.11.2
  printing: ^5.13.4
  excel: ^4.0.6
  path_provider: ^2.1.5
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  record_linux: ^1.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
